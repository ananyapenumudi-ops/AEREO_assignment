# Optional: a local Postgres if you don't want to use the default SQLite file.
#   docker compose up -d
#   DATABASE_URL=postgresql+psycopg://certs:certs@localhost:5432/certs
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: certs
      POSTGRES_PASSWORD: certs
      POSTGRES_DB: certs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
